<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>こいこい開発</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1b1e25;--line:#333844;--muted:#a1a9b8;--text:#edf0f5;--blue:#86b7ff;--gold:#e1c180}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 system-ui,sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:6px;background:#252a34;padding:6px 12px}button:hover{border-color:var(--blue);background:#303a4a}button:disabled{opacity:.4;cursor:default}button.primary{background:#285294;border-color:#5284c8}button.danger{color:#ffaaaa}input,select,textarea{background:#14171e;border:1px solid var(--line);border-radius:5px;padding:8px;width:100%;min-width:0}textarea{resize:vertical;min-height:100px}input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}label{display:block;color:var(--muted);margin:10px 0 4px}h1,h2,h3,p{margin:0}h1{font-size:17px;white-space:nowrap}h2{font-size:16px}h3{font-size:14px}header{position:sticky;top:0;z-index:3;background:#151820f5;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.muted{color:var(--muted)}main{max-width:1440px;margin:auto;padding:20px 24px 80px}.overview{display:grid;grid-template-columns:1fr auto;gap:12px;padding-bottom:20px}.scope{font-size:21px;margin-right:8px}.handoff{white-space:pre-wrap;margin-top:8px;max-width:940px}.progress{align-self:start;text-align:right}.progress strong{font-size:24px}.progress small{display:block;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(300px,4fr) minmax(0,6fr);gap:18px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px}.toolbar{gap:6px;margin-bottom:12px}.toolbar button[aria-pressed=true]{background:#36435c;border-color:var(--blue)}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.list{margin-top:12px}.item{display:block;text-align:left;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 8px}.item[aria-current=true]{background:#2a3343;border-left:3px solid var(--blue)}.item-title{display:block;margin:4px 0;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:12px}.badge{font-size:12px;border:1px solid #5e6677;border-radius:4px;padding:1px 6px;white-space:nowrap}.badge.todo{background:#1d3759;color:#9bc7ff;border-color:#446c9e}.badge.doing{color:#b9d2ff;background:#30405c}.badge.review{color:var(--gold);background:#433825}.badge.done,.badge.answered{color:#9fd5b4}.badge.waiting,.badge.blocked{color:#f3aaa2}.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.actions{margin-top:14px}.notice{border:1px solid #ac824a;color:#ffe0ab;background:#3a3022;border-radius:6px;padding:9px 12px;margin-bottom:12px;white-space:pre-wrap;overflow-wrap:anywhere}.notice[hidden]{display:none}details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}summary{cursor:pointer;color:var(--muted)}.thread{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}.event{border-left:2px solid #475269;margin-top:14px;padding-left:12px}.event p,.pre{white-space:pre-wrap;overflow-wrap:anywhere}.event details{font-size:12px}.links{margin:12px 0}.links button{font-size:12px;margin:3px}.empty{padding:28px 4px;color:var(--muted)}dialog{width:min(640px,calc(100% - 24px));max-height:90vh;background:var(--panel);color:var(--text);border:1px solid #59667d;border-radius:10px;padding:22px}dialog::backdrop{background:#0009}#status{font-size:12px;color:var(--muted)}.help{font-size:12px;color:var(--muted);margin-top:10px}.divider{border-top:1px solid var(--line);padding-top:15px;margin-top:20px}@media(max-width:800px){header{padding:10px 12px}main{padding:14px 12px}.layout{grid-template-columns:1fr}.overview{grid-template-columns:1fr}.progress{text-align:left}.progress strong{font-size:18px}.panel{padding:12px}.filters{grid-template-columns:1fr 1fr}.header-actions button{padding:5px 8px}.two{grid-template-columns:1fr}}
</style>
<header><h1 id="identity">こいこい開発</h1><div class="row header-actions"><span id="status">接続中</span><button id="backup">バックアップ</button><button id="settings">設定</button></div></header>
<main><div id="message" class="notice" role="status" hidden></div><section class="overview"><div><span class="muted">現在のスコープ</span><div class="row"><strong id="scope" class="scope"></strong><button id="change-scope">変更</button></div><p id="handoff" class="handoff"></p><p id="next" class="muted handoff"></p></div><div class="progress"><strong id="progress"></strong><small>全スコープ・現在の期間</small><small id="period"></small><small id="review-count"></small></div></section>
<div class="layout"><section class="panel"><div class="row toolbar" id="views"><button data-view="tasks">タスク</button><button data-view="questions">質問</button><button data-view="history">履歴</button><button data-view="archive">旧資料</button><button data-view="trash">ゴミ箱</button></div><div class="filters"><input id="search" aria-label="記録を検索" placeholder="タイトル・本文を検索"><select id="scope-filter" aria-label="スコープで絞り込む"><option value="">全スコープ</option></select></div><div class="row actions"><button id="new-task" class="primary">タスク追加</button><button id="new-question">質問追加</button><button id="new-note">メモ追加</button></div><div id="list" class="list"></div><div class="pagination"><button id="previous">前へ</button><span id="page" class="meta"></span><button id="next-page">次へ</button></div></section>
<section id="detail" class="panel"><p class="empty">記録を選ぶと、内容・修正依頼・回答をここに表示します。</p></section></div>
<p class="help">保存するとSQLiteへ即時反映します。バックアップは復旧用のスナップショットです。ブラウザでの保存・依頼は、停止中のAIを自動起動しません。</p></main>
<datalist id="scopes"></datalist>
<dialog id="project-dialog"><h2>プロジェクト設定</h2><p id="project-conflict" class="notice" hidden>設定が更新されました。入力は保持しています。最新の設定を別途確認してから変更を反映してください。</p><form id="project-form"><label for="project-scope">現在のスコープ（既存名を選択／新規入力）</label><input id="project-scope" list="scopes" required><label for="project-handoff">引き継ぎ</label><textarea id="project-handoff" rows="4"></textarea><label for="project-next">次の作業</label><textarea id="project-next" rows="2"></textarea><div class="row actions"><button class="primary" type="submit">設定を保存</button><button type="button" id="project-cancel">閉じる</button></div></form><div class="divider"><h3>進捗期間の区切り</h3><p class="help">push成功と必要な検証を確認した後に実行します。未完了・確認待ちは次の期間に残り、過去の完了は履歴に残ります。Gitフックではありません。</p><label for="checkpoint-label">節目の名前・確認済みコミット</label><input id="checkpoint-label"><button id="checkpoint" class="actions">この節目で区切る</button></div></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const states={task:['todo','doing','review','done','waiting','blocked','inbox','canceled'],question:['open','answered','closed'],note:['recorded']};
const labels={todo:'予定',doing:'作業中',review:'確認待ち',done:'完了',waiting:'回答待ち',blocked:'保留',inbox:'アイデア',canceled:'中止',open:'未回答',answered:'回答済み',closed:'終了',recorded:'記録'};
let brief, selected=null, item=null, baseline='', view='tasks', offset=0, newKind='', projectRev=0, projectBaseline='', loadedEvents=[], listGeneration=0;
const token='__DASHBOARD_TOKEN__';
async function api(path='/api',payload){const r=await fetch(path,{method:payload?'POST':'GET',headers:{'X-Dashboard-Token':token,...(payload?{'Content-Type':'application/json'}:{})},...(payload?{body:JSON.stringify(payload)}:{})});const data=await r.json();if(!r.ok)throw Object.assign(new Error(data.error||'通信エラー'),{status:r.status});return data;}
function notify(text){$('#message').textContent=text;$('#message').hidden=!text;}
function date(s){return s?new Date(s).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'';}
function values(){const f=$('#item-form');if(!f)return{};return Object.fromEntries(new FormData(f));}
function dirty(){if(!$('#item-form'))return false;const v=values();if(newKind)return ['title','body','next_action','acceptance','verification','resolution','blocked_reason','answer'].some(k=>(v[k]||'').trim())||!!($('#reply')?.value.trim());return JSON.stringify(v)!==baseline||!!($('#reply')?.value.trim());}
function leave(){return !dirty()||confirm('未保存の入力を破棄して移動しますか？');}
function options(values,current){return values.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(labels[v]||v)}</option>`).join('');}
function paintBrief(){const p=brief.project;$('#identity').textContent=p.name;document.title=p.name;$('#scope').textContent=p.current_scope;$('#handoff').textContent=p.handoff;$('#next').textContent=p.next_action;$('#progress').textContent=`${brief.progress.done} / ${brief.progress.total} 完了`;$('#period').textContent=p.progress_label;$('#review-count').textContent=`確認待ち ${brief.overall_counts.review||0} 件`;const scopes=[...new Set([...brief.scopes,p.current_scope])];$('#scopes').innerHTML=scopes.map(s=>`<option value="${esc(s)}">`).join('');const current=$('#scope-filter').value;$('#scope-filter').innerHTML='<option value="">全スコープ</option>'+options(scopes,current);$('#status').textContent='保存先：ローカルSQLite';}
async function reconcileDetail(){if(!selected)return;const id=selected;const data=await api('/api/item?id='+encodeURIComponent(id));if(selected!==id)return;if(data.item.rev!==item.rev){if(dirty()){$('#conflict').textContent='別の操作で更新されました。未保存の入力は保持しています。';$('#conflict').hidden=false;}else render(data.item,data.can_confirm,data.events);}}
async function refresh(){brief=await api('/api/brief');paintBrief();await list();await reconcileDetail();}
async function list(){const generation=++listGeneration;const params=new URLSearchParams({view,scope:$('#scope-filter').value,search:$('#search').value,offset,limit:12});const data=await api('/api/items?'+params);if(generation!==listGeneration)return;if(offset>=data.total&&offset>0){offset=Math.max(0,Math.floor((data.total-1)/12)*12);return list();}$('#list').innerHTML=data.items.map(r=>`<button class="item" data-id="${esc(r.id)}" aria-current="${r.id===selected}"><span class="badge ${esc(r.status)}">${esc(labels[r.status])}</span><span class="item-title">${esc(r.title)}</span><span class="meta">${esc(r.scope)} · ${esc(r.id)}</span></button>`).join('')||'<p class="empty">該当する記録はありません。</p>';$('#page').textContent=`${data.total?offset+1:0}–${Math.min(offset+12,data.total)} / ${data.total}`;$('#previous').disabled=offset===0;$('#next-page').disabled=offset+12>=data.total;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));}
function advanced(r){return ['next_action','acceptance','verification','resolution','blocked_reason','answer'].map((k,i)=>`<label for="field-${k}">${['次の作業','受け入れ条件','検証記録','結論','保留の理由','保存済みの回答'][i]}</label><textarea id="field-${k}" name="${k}" rows="2">${esc(r[k]||'')}</textarea>`).join('');}
function render(r,canConfirm=false,events=[]){item=r;const readonly=r.deleted||r.archived;$('#detail').innerHTML=`<div class="detail-top"><h2>${newKind?({task:'新しいタスク',question:'新しい質問',note:'新しいメモ'}[newKind]):esc(r.id)}</h2><button id="cancel-edit">${newKind?'キャンセル':'選択を閉じる'}</button></div><p id="conflict" class="notice" hidden></p><form id="item-form"><fieldset ${readonly?'disabled':''} style="border:0;padding:0;margin:0"><label for="field-title">タイトル</label><input name="title" id="field-title" value="${esc(r.title)}" required maxlength="300"><label for="field-body">依頼・内容</label><textarea name="body" id="field-body" rows="6">${esc(r.body)}</textarea><div class="two"><div><label for="field-status">状態</label><select id="field-status" name="status">${options(states[r.kind],r.status)}</select></div><div><label for="field-scope">スコープ</label><input id="field-scope" name="scope" list="scopes" value="${esc(r.scope)}" required></div></div><details><summary>補足・検証など（任意）</summary>${advanced(r)}</details>${!readonly?'<div class="row actions"><button type="submit" class="primary">保存</button>'+(canConfirm?'<button id="confirm-item" type="button">確認して完了</button>':'')+'</div>':''}</fieldset></form>${!newKind?`<div class="row actions">${r.deleted?'<button id="restore-item">復元</button>':'<button id="delete-item" class="danger">削除してゴミ箱へ</button>'}</div><div class="links">${(r.depends_on||[]).map(id=>`<button data-related="${esc(id)}">前提 ${esc(id)}</button>`).join('')}${(r.required_questions||[]).map(id=>`<button data-related="${esc(id)}">質問 ${esc(id)}</button>`).join('')}${r.source?'<p class="meta">出典：'+esc(r.source)+'</p>':''}</div><section class="thread"><h3>この記録のやりとり</h3>${readonly?'<p class="muted">読み取り専用です。</p>':'<label for="reply">追記・回答</label><textarea id="reply" rows="3" placeholder="修正依頼・質問・回答は同じ記録に残します"></textarea><div class="row actions">'+(r.kind!=='note'?'<button data-thread="request">追加・修正を依頼</button><button data-thread="question">質問する</button><button data-thread="answer">回答を保存</button>':'')+'<button data-thread="comment">メモを残す</button></div>'}${r.kind==='question'&&!readonly?(r.promoted_task_id?`<button data-related="${esc(r.promoted_task_id)}" class="actions">実装タスクを開く</button>`:'<button id="promote" class="actions">回答から実装タスクを作成</button>'):''}<div id="events"></div><button id="older-events" class="actions">以前の履歴</button></section>`:''}`;baseline=JSON.stringify(values());loadedEvents=events;paintEvents();$('#item-form').onsubmit=save;$('#cancel-edit').onclick=()=>{if(leave()){selected=null;newKind='';item=null;$('#detail').innerHTML='<p class="empty">記録を選んでください。</p>';list().catch(fail);}};if($('#confirm-item'))$('#confirm-item').onclick=()=>act('confirm');if($('#delete-item'))$('#delete-item').onclick=()=>{if(confirm('この記録をゴミ箱へ移しますか？ 復元できます。'))act('delete');};if($('#restore-item'))$('#restore-item').onclick=()=>act('restore-item');if($('#promote'))$('#promote').onclick=()=>act('promote',{text:$('#reply').value});if($('#older-events'))$('#older-events').onclick=older;}
function paintEvents(){if(!$('#events'))return;$('#events').innerHTML=loadedEvents.map(e=>`<article class="event"><span class="meta">${esc(date(e.at))} · ${esc(e.actor==='user'?'あなた':e.actor==='assistant'?'AI':'システム')} · ${esc(e.data.mode||e.action)}</span>${e.data.text?'<p>'+esc(e.data.text)+'</p>':'<details><summary>変更内容</summary><p>'+esc(JSON.stringify(e.data,null,2))+'</p></details>'}</article>`).join('');$('#older-events').hidden=loadedEvents.length===0||loadedEvents.length%50!==0;}
async function older(){try{const rows=await api('/api/events?'+new URLSearchParams({id:selected,before:loadedEvents.at(-1).seq,limit:50}));loadedEvents.push(...rows);paintEvents();if(rows.length<50)$('#older-events').hidden=true;}catch(e){fail(e);}}
async function openItem(id,guard=true){if(guard&&!leave())return;const data=await api('/api/item?id='+encodeURIComponent(id));selected=id;newKind='';render(data.item,data.can_confirm,data.events);await list();}
async function save(event){event.preventDefault();try{const data=values();const saved=await api('/api',newKind?{action:'create',data:{kind:newKind,...data}}:{action:'update',id:item.id,rev:item.rev,data});notify('保存しました。');await openItem(saved.id,false);await refresh();}catch(e){fail(e);}}
async function act(action,extra={}){try{if(JSON.stringify(values())!==baseline){notify('内容の変更を保存してから、この操作を行ってください。');return;}const saved=await api('/api',{action,id:item.id,rev:item.rev,...extra});notify('保存しました。');await openItem(saved.id,false);await refresh();}catch(e){fail(e);}}
function fail(e){notify(e.status===409?'他の操作で更新されています。入力は保持しました。最新の内容と照合してから保存してください。':e.message);if(e.status===409&&$('#conflict')){$('#conflict').textContent='競合：未保存の入力を保持しています。別タブで最新の記録を確認するか、入力を控えてから選択し直してください。';$('#conflict').hidden=false;}}
function add(kind){if(!leave())return;selected=null;newKind=kind;render({kind,title:'',body:'',status:states[kind][0],scope:brief.project.current_scope});list().catch(fail);$('#field-title').focus();}
$('#new-task').onclick=()=>add('task');$('#new-question').onclick=()=>add('question');$('#new-note').onclick=()=>add('note');
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.id)openItem(b.dataset.id).catch(fail);if(b.dataset.related)openItem(b.dataset.related).catch(fail);if(b.dataset.thread)act('thread',{mode:b.dataset.thread,text:$('#reply').value});if(b.dataset.view){view=b.dataset.view;offset=0;list().catch(fail);}});
let searchTimer;$('#search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{offset=0;list().catch(fail);},250);};$('#scope-filter').onchange=()=>{offset=0;list().catch(fail);};$('#previous').onclick=()=>{offset-=12;list().catch(fail);};$('#next-page').onclick=()=>{offset+=12;list().catch(fail);};
function projectValues(){return {current_scope:$('#project-scope').value,handoff:$('#project-handoff').value,next_action:$('#project-next').value};}
function settings(){projectRev=brief.project.rev;for(const [id,key]of [['project-scope','current_scope'],['project-handoff','handoff'],['project-next','next_action']])$('#'+id).value=brief.project[key];projectBaseline=JSON.stringify(projectValues());$('#project-conflict').hidden=true;$('#project-dialog').showModal();$('#project-scope').focus();}
$('#settings').onclick=settings;$('#change-scope').onclick=settings;
function closeProject(){if(JSON.stringify(projectValues())!==projectBaseline&&!confirm('未保存の設定を破棄しますか？'))return;$('#project-dialog').close();}
$('#project-cancel').onclick=closeProject;$('#project-dialog').addEventListener('cancel',e=>{e.preventDefault();closeProject();});
$('#project-form').onsubmit=async e=>{e.preventDefault();try{await api('/api',{action:'project',rev:projectRev,data:projectValues()});$('#project-dialog').close();notify('現在のスコープと設定を保存しました。既存の記録は変更していません。');await refresh();}catch(error){if(error.status===409)$('#project-conflict').hidden=false;fail(error);}};
$('#checkpoint').onclick=async()=>{try{if(JSON.stringify(projectValues())!==projectBaseline){notify('設定を保存してから区切ってください。');return;}await api('/api',{action:'checkpoint',rev:projectRev,label:$('#checkpoint-label').value});$('#project-dialog').close();await refresh();notify('進捗期間を区切りました。未完了・確認待ちは引き継がれます。');}catch(e){fail(e);}};
$('#backup').onclick=async()=>{try{await api('/api',{action:'backup'});notify('復旧用バックアップを作成しました。通常の保存内容もすでにSQLiteへ反映されています。');}catch(e){fail(e);}};
window.addEventListener('beforeunload',e=>{if(dirty()||($('#project-dialog').open&&JSON.stringify(projectValues())!==projectBaseline)){e.preventDefault();e.returnValue='';}});
let polling=false;setInterval(async()=>{if(!brief||polling)return;polling=true;try{const changes=await api('/api/events?after='+brief.cursor+'&limit=1');if(changes.length){await refresh();if($('#project-dialog').open&&brief.project.rev!==projectRev)$('#project-conflict').hidden=false;}}catch(e){$('#status').textContent='再接続待ち（入力を保持）';}finally{polling=false;}},4000);
refresh().catch(fail);
</script></html>
